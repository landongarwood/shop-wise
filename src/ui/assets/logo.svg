<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ShopWise">
  <!--
    A shopping bag with a smile. It says "shop" before anything is read, which
    a chart or a receipt does not — those belong to every analytics tool ever
    made.

    One colour, nothing behind it, so it sits on any surface in either theme.
    Thick rounded strokes on a 64 grid, which is what keeps the silhouette and
    the smile intact once Windows draws it at 16px.
  -->
  <g fill="none" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M13 21h38l-3.2 29a6 6 0 0 1-6 5.4H22.2a6 6 0 0 1-6-5.4z" />
    <!-- handle -->
    <path d="M24 25v-7a8 8 0 0 1 16 0v7" />
    <!-- smile -->
    <path d="M26 38a7 7 0 0 0 12 0" stroke-width="4" />
  </g>
</svg>
