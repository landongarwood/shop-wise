<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="shopwise-token" content="{{SESSION_TOKEN}}" />
    <title>{{PRODUCT_NAME}}</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar">
        <div class="brand">
          <span class="brand-mark">SW</span>
          <span class="brand-name">{{PRODUCT_NAME}}</span>
        </div>

        <ul class="nav" id="nav"></ul>

        <div class="sidebar-foot">
          <button class="ghost" id="theme-toggle" type="button">Dark mode</button>
          <span class="version">v{{VERSION}}</span>
        </div>
      </nav>

      <main class="content">
        <header class="topbar">
          <h1 id="view-title">Dashboard</h1>
          <div class="topbar-meta" id="topbar-meta"></div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
